name: Build Android App & Widget

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Native Android Project with Widget
        run: |
          mkdir -p android_app/app/src/main/assets
          mkdir -p android_app/app/src/main/java/com/matiz/coupleapp
          mkdir -p android_app/app/src/main/res/layout
          mkdir -p android_app/app/src/main/res/xml
          mkdir -p android_app/app/src/main/res/drawable

          cp index.html android_app/app/src/main/assets/index.html

          cat << 'EOF' > android_app/settings.gradle
          rootProject.name = "CoupleApp"
          include ':app'
          EOF

          cat << 'EOF' > android_app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > android_app/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.matiz.coupleapp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.matiz.coupleapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Мы Рядом ❤️"
                  android:icon="@android:drawable/btn_star_big_on"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".CoupleWidget"
                      android:exported="true"
                      android:label="Мы Рядом ❤️">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_app/app/src/main/res/drawable/widget_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#171422" />
              <corners android:radius="22dp" />
              <stroke android:width="1dp" android:color="#40FF3B7F" />
          </shape>
          EOF

          cat << 'EOF' > android_app/app/src/main/res/layout/widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg"
              android:orientation="horizontal"
              android:padding="14dp"
              android:gravity="center_vertical">

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:orientation="vertical">

                  <TextView
                      android:id="@+id/w_partner_title"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="🥰 Полина • ⚡ 84%"
                      android:textColor="#FFFFFF"
                      android:textSize="16sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/w_partner_mood"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="3dp"
                      android:text="Жду вечернего созвона"
                      android:textColor="#9B95B0"
                      android:textSize="13sp" />

                  <TextView
                      android:id="@+id/w_distance"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="6dp"
                      android:text="📍 Между вами 640 км"
                      android:textColor="#FF3B7F"
                      android:textSize="12sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:gravity="end"
                  android:paddingStart="10dp">

                  <TextView
                      android:id="@+id/w_cd_days"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="✈️ 14 дн."
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/w_cd_title"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:text="Встреча в аэропорту"
                      android:textColor="#9B95B0"
                      android:textSize="11sp" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > android_app/app/src/main/res/xml/widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="90dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > android_app/app/src/main/java/com/matiz/coupleapp/MainActivity.java
          package com.matiz.coupleapp;

          import android.app.Activity;
          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.parseColor("#0d0b14"));
                  getWindow().setNavigationBarColor(Color.parseColor("#120f1c"));

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);

                  webView.setBackgroundColor(Color.parseColor("#0d0b14"));
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.addJavascriptInterface(new WidgetBridge(this), "AndroidWidget");

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              public static class WidgetBridge {
                  private final Context context;
                  public WidgetBridge(Context ctx) { this.context = ctx; }

                  @JavascriptInterface
                  public void updateWidget(String jsonState) {
                      SharedPreferences prefs = context.getSharedPreferences("WidgetPrefs", Context.MODE_PRIVATE);
                      prefs.edit().putString("state_json", jsonState).apply();

                      Intent intent = new Intent(context, CoupleWidget.class);
                      intent.setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE);
                      int[] ids = AppWidgetManager.getInstance(context)
                              .getAppWidgetIds(new ComponentName(context, CoupleWidget.class));
                      intent.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, ids);
                      context.sendBroadcast(intent);
                  }
              }
          }
          EOF

          cat << 'EOF' > android_app/app/src/main/java/com/matiz/coupleapp/CoupleWidget.java
          package com.matiz.coupleapp;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class CoupleWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  SharedPreferences prefs = context.getSharedPreferences("WidgetPrefs", Context.MODE_PRIVATE);
                  String jsonStr = prefs.getString("state_json", null);

                  String pName = "Полина";
                  String pEmoji = "🥰";
                  int pBat = 84;
                  String pMood = "Жду вечернего созвона";
                  int dist = 640;
                  String cdEmoji = "✈️";
                  int cdDays = 14;
                  String cdTitle = "Встреча в аэропорту";

                  if (jsonStr != null) {
                      try {
                          JSONObject obj = new JSONObject(jsonStr);
                          pName = obj.optString("partnerName", pName);
                          pEmoji = obj.optString("partnerMoodEmoji", pEmoji);
                          pBat = obj.optInt("partnerBattery", pBat);
                          pMood = obj.optString("partnerMoodText", pMood);
                          dist = obj.optInt("distanceKm", dist);

                          JSONArray cds = obj.optJSONArray("countdowns");
                          if (cds != null && cds.length() > 0) {
                              JSONObject pinned = cds.getJSONObject(0);
                              for (int i = 0; i < cds.length(); i++) {
                                  JSONObject item = cds.getJSONObject(i);
                                  if (item.optBoolean("pinned", false)) {
                                      pinned = item;
                                      break;
                                  }
                              }
                              cdEmoji = pinned.optString("emoji", cdEmoji);
                              cdDays = pinned.optInt("days", cdDays);
                              cdTitle = pinned.optString("title", cdTitle);
                          }
                      } catch (Exception ignored) {}
                  }

                  for (int appWidgetId : appWidgetIds) {
                      RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_layout);
                      views.setTextViewText(R.id.w_partner_title, pEmoji + " " + pName + " • ⚡ " + pBat + "%");
                      views.setTextViewText(R.id.w_partner_mood, pMood);
                      views.setTextViewText(R.id.w_distance, "📍 Между вами " + dist + " км");
                      views.setTextViewText(R.id.w_cd_days, cdEmoji + " " + cdDays + " дн.");
                      views.setTextViewText(R.id.w_cd_title, cdTitle);

                      Intent intent = new Intent(context, MainActivity.class);
                      PendingIntent pendingIntent = PendingIntent.getActivity(
                              context, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      views.setOnClickPendingIntent(R.id.widget_root, pendingIntent);

                      appWidgetManager.updateAppWidget(appWidgetId, views);
                  }
              }
          }
          EOF

      - name: Build APK with Gradle
        run: |
          cd android_app
          gradle assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: MyRyadom-App-With-Widget
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
